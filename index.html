<!doctype html><html lang="hi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220">
<title>Sentra</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f8fafc;font-family:system-ui,sans-serif}
.app{max-width:560px;margin:auto;padding:22px 16px 40px}.logo{font-size:32px;font-weight:800}.sub{color:#94a3b8}
.card{background:#121c2e;border:1px solid #26344b;border-radius:20px;padding:18px;margin:12px 0}.hero{padding:24px}
button{border:0;border-radius:14px;padding:13px 17px;background:#fff;color:#0b1220;font-weight:700;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{min-height:105px}.icon{font-size:25px}
textarea{width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1px solid #334155;background:#0b1220;color:#fff}
.status{margin-top:10px;font-size:13px;color:#94a3b8}
#chatBox{margin-top:14px;max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.msg{padding:10px 14px;border-radius:14px;max-width:80%;line-height:1.4;white-space:pre-wrap;font-size:14.5px}
.msg.user{align-self:flex-end;background:#2563eb;color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:#1e293b;color:#f8fafc;border-bottom-left-radius:4px}
.dots span{animation:blink 1.4s infinite both}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.inputRow{display:flex;gap:8px;margin-top:12px}
.inputRow input{flex:1;padding:12px;border-radius:12px;border:1px solid #334155;background:#0b1220;color:#fff;font-size:14.5px}
.inputRow button{padding:12px 18px;white-space:nowrap}
</style></head><body><div class="app">
<div class="logo">Sentra</div><div class="sub">Think clearly. Build safely.</div>
<section class="card hero"><h1>नमस्ते 👋</h1><p>Sentra v0.4 — Voice + AI Brain</p>
<button id="talk">🎙️ Talk to Sentra</button><div id="status" class="status">Microphone ready</div>
<div id="chatBox"></div>
<div class="inputRow">
  <input id="textInput" type="text" placeholder="यहाँ अपना सवाल लिखें..." />
  <button id="sendBtn">भेजें</button>
</div>
</section>
<div class="grid"><div class="card tile">📅<br><b>Today</b><div class="sub">आज का प्लान</div></div>
<div class="card tile">💡<br><b>Ideas</b><div class="sub">नए विचार</div></div>
<div class="card tile">🔔<br><b>Reminders</b><div class="sub">याद रखने वाली बातें</div></div>
<div class="card tile">🧠<br><b>Memory</b><div class="sub">Sentra की memory</div></div></div>
<section class="card"><b>Quick Note</b><textarea id="note" rows="3" placeholder="अपना idea या काम लिखो..."></textarea>
<button onclick="saveNote()" style="margin-top:10px">Save</button><div id="notes" class="status"></div></section>
</div><script>
let recognition=null,listening=false;
const notes=JSON.parse(localStorage.getItem('sentra_notes')||'[]');
const chatHistory=JSON.parse(localStorage.getItem('sentra_chat')||'[]');
const $=id=>document.getElementById(id);

function renderNotes(){$('notes').textContent=notes.slice(-5).reverse().join('\n')}
function saveNote(){const v=$('note').value.trim();if(!v)return;notes.push('• '+v);localStorage.setItem('sentra_notes',JSON.stringify(notes));$('note').value='';renderNotes()}

function renderChat(){
  const box=$('chatBox');box.innerHTML='';
  chatHistory.forEach(m=>{
    const d=document.createElement('div');
    d.className='msg '+(m.role==='user'?'user':'ai');
    d.textContent=(m.role==='user'?'':'Sentra: ')+m.text;
    box.appendChild(d);
  });
  box.scrollTop=box.scrollHeight;
}
function addMessage(role,text){chatHistory.push({role,text});localStorage.setItem('sentra_chat',JSON.stringify(chatHistory));renderChat()}

function showTyping(){
  const box=$('chatBox');
  const d=document.createElement('div');
  d.className='msg ai dots';d.id='typingDots';
  d.innerHTML='<span>●</span> <span>●</span> <span>●</span>';
  box.appendChild(d);box.scrollTop=box.scrollHeight;
}
function hideTyping(){const t=$('typingDots');if(t)t.remove()}

function speak(text){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='hi-IN';speechSynthesis.speak(u)}}

async function askSentra(text){
  addMessage('user',text);
  $('status').textContent='🧠 Sentra सोच रहा है...';
  showTyping();
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    const data=await res.json();
    hideTyping();
    if(!res.ok)throw new Error(data.error||'AI request failed');
    addMessage('ai',data.reply);
    $('status').textContent='✅ जवाब तैयार';
    speak(data.reply);
  }catch(e){
    hideTyping();
    $('status').textContent='AI error: '+e.message;
  }
}

$('sendBtn').onclick=()=>{
  const v=$('textInput').value.trim();
  if(!v)return;
  $('textInput').value='';
  askSentra(v);
};
$('textInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){$('sendBtn').click();}
});

$('talk').onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$('status').textContent='इस browser में voice input उपलब्ध नहीं है।';return}
  if(listening){recognition.stop();return}
  recognition=new SR();recognition.lang='hi-IN';recognition.interimResults=true;recognition.continuous=false;
  recognition.onstart=()=>{listening=true;$('talk').textContent='⏹️ Stop Listening';$('status').textContent='🎙️ सुन रहा हूँ... बोलिए'};
  recognition.onresult=e=>{
    let x='';for(let i=e.resultIndex;i<e.results.length;i++)x+=e.results[i][0].transcript;
    if(e.results[e.results.length-1].isFinal)askSentra(x);
  };
  recognition.onerror=e=>{$('status').textContent='Voice input error: '+e.error};
  recognition.onend=()=>{listening=false;$('talk').textContent='🎙️ Talk to Sentra'};
  recognition.start();
};

renderNotes();
renderChat();
</script></body></html>
